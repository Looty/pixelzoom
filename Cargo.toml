[package]
name = "pixelzoom"
version = "0.1.0"
edition = "2024"
description = "Lightweight Windows screen magnifier: Ctrl+scroll zoom with GPU Lanczos3 scaling, ClearType-aware sharpening and HDR support"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Looty/pixelzoom"
keywords = ["windows", "zoom", "magnifier", "accessibility", "tray"]
categories = ["accessibility", "graphics"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Console", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Devices_Display"] }
windows-numerics = "0.3"

[build-dependencies]
embed-resource = "3.0.12"
